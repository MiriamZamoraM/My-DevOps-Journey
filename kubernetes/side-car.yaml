apiVersion: apps/v1
kind: Deployment

metadata:
  name: multi-tool
  labels:
    app: herramientas

spec:
  replicas: 2
  selector:
    matchLabels:
      app: herramientas
  template:
    metadata:
      labels:
        app: herramientas
    spec:
      containers:
      - name: principal
        image: nginx
      - name: ayudante
        image: redis:alpine